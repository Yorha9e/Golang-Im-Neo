user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Gzip 静态资源压缩 (极大降低前端 JS/CSS 首屏传输开销)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 防 CC 攻击与限流区域配置
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    limit_req_zone  $binary_remote_addr zone=req_limit_per_ip:10m  rate=50r/s;

    # WebSocket 升级映射
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 后端应用集群定义 (对应 Docker 内部网络服务名)
    upstream im_backend {
        server im-backend:8080;
        keepalive 32;
    }

    server {
        listen 443 ssl;
        server_name _;

        # SSL 证书配置 (支持自签名证书与权威 CA 证书零停机热替换)
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # 单 IP 连接数与突发请求保护
        limit_conn conn_limit_per_ip 30;
        limit_req  zone=req_limit_per_ip burst=100 nodelay;

        # 隐藏 Nginx 版本号 (防御黑客指纹识别)
        server_tokens off;

        # 基础安全请求头
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # 1. 静态前端资源托管 (SPA 模式)
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;

            # 静态资源强缓存 (带内容哈希的文件)
            location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2|woff)$ {
                expires 30d;
                add_header Cache-Control "public, max-age=2592000, immutable";
                access_log off;
            }
        }

        # 2. RESTful API 代理转发
        location /api/ {
            proxy_pass http://im_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 适配图片、头像与媒体大文件上传 (上限 25MB)
            client_max_body_size 25M;
            client_body_buffer_size 1M;

            # 代理超时配置
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # 3. WebSocket 二进制长连接代理转发
        location /ws {
            proxy_pass http://im_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 超时设置 (配合 30s 底层心跳，避免空闲断开)
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # 4. 健康检查探针透传
        location /health {
            proxy_pass http://im_backend/health;
            access_log off;
        }
    }
}
