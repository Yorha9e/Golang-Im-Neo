version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. 后端应用容器 (Go IM Neo System)
  #    完全处于内部 Docker 私有网络，公网无法直接探测与扫描
  # -------------------------------------------------------------
  im-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: golang-im-backend
    restart: always
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # 持久化数据卷挂载：SQLite 数据库与媒体文件持久保留在宿主机
      - ./data:/app/data
      # 配置文件挂载：可在宿主机直接修改并热重载
      - ./config.toml:/app/config.toml:ro
    networks:
      - im-internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || wget -q --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # -------------------------------------------------------------
  # 2. 边缘防护网关 (Nginx Alpine)
  #    单入口暴露，负责抗 CC、静态托管、SSL 预留与长连接转发
  # -------------------------------------------------------------
  im-gateway:
    image: nginx:1.25-alpine
    container_name: golang-im-gateway
    restart: always
    environment:
      - TZ=Asia/Shanghai
    ports:
      # 对外暴露端口：默认为 8080，映射到内部 Nginx SSL 443 端口
      - "${PORT:-8080}:443"
    volumes:
      # 挂载自定义安全配置
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # 挂载编译好的前端产物 (静态托管，零 Node 进程消耗)
      - ./frontend/dist:/usr/share/nginx/html:ro
      # 挂载 SSL 自签/CA 证书目录
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      im-backend:
        condition: service_healthy
    networks:
      - im-internal

# -------------------------------------------------------------
# 私有容器桥接网络
# -------------------------------------------------------------
networks:
  im-internal:
    driver: bridge
