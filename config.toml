[server]
host = "0.0.0.0"
port = 8080
read_timeout = "30s"
write_timeout = "30s"
mode = "debug"

[security]
jwt_secret = "change-me-in-production-32chars-long-secret"
jwt_access_expire = "2h"
jwt_refresh_expire = "336h" # 14d
bcrypt_cost = 10

[database]
path = "./data/im.db"
max_open_conns = 1
max_idle_conns = 1
busy_timeout = "5000"
wal_checkpoint_truncate = true

[admin]
username = "superadmin"
password = "SuperAdmin123!"
email = "admin@golang-im.local"

[media]
storage_dir = "./data/media"
cdn_base_url = "" # Optional CDN prefix (e.g. "https://img.yourdomain.com"). Left empty, defaults to local "/api/v1/media/"
max_avatar_bytes = 2097152
max_file_bytes = 20971520
allowed_avatar_exts = ".jpg,.jpeg,.png,.gif,.webp"
allowed_file_exts = ".jpg,.jpeg,.png,.gif,.webp,.aac,.mp3,.wav,.mp4"
